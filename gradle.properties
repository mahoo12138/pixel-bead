# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official

# Minecraft / NeoForge / KFF (verified versions - see plan)
minecraft_version=26.3
neo_version=26.3.0.99
kff_version=6.5.0
kotlin_version=2.4.21

# Mod identity + publishing metadata.
# These are expanded into META-INF/neoforge.mods.toml by processResources, so the
# jar name, the in-game mod list and every release page stay in sync.
# Keep this file ASCII-only: java.util.Properties reads ISO-8859-1 on some JVMs;
# Chinese copy lives in the TOML/README instead.
mod_id=pixelbead
mod_name=Pixel Bead
mod_version=0.1.0-rc.1
mod_group=com.pixelbead
mod_authors=mahoo12138
mod_license=MIT
mod_url_source=https://github.com/mahoo12138/pixel-bead
mod_url_issues=https://github.com/mahoo12138/pixel-bead/issues
mod_url_license=https://github.com/mahoo12138/pixel-bead/blob/main/LICENSE
