# Pixel Bead / 像素豆 - https://github.com/mahoo12138/pixel-bead
# Placeholder values are expanded from gradle.properties by processResources, so
# the shipped metadata can never drift from the build version. Chinese copy lives
# in this UTF-8 file (gradle.properties stays ASCII for Properties compatibility).

modLoader="kotlinforforge"
loaderVersion="[6,)"
license="${mod_license}"
licenseURL="${mod_url_license}"
issueTrackerURL="${mod_url_issues}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="MARD 291 colour data by MakeBead (MIT). NeoForged and Kotlin for Forge contributors. Artwork provenance: see META-INF/NOTICE.md."
displayURL="${mod_url_source}"
issueTrackerURL="${mod_url_issues}"
description='''像素豆 (Pixel Bead) — 一颗一色，拼出世界。
Minecraft 像素拼豆创作模组：291 色 MARD 拼豆方块、拼豆染色工作台，以及服务端权威的虚拟 18 槽色带建造模式。'''
# NeoForge 26.3 replaced the deprecated `logoFile` key with `iconFile` (square)
# and `bannerFile` (wide). The icon is generated from the MARD colour table by
# tools/make_icon.py; see NOTICE.md section 4 for provenance and reproduction.
iconFile="pixelbead:icon.png"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[26.3.0.99,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[26.3,26.4)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="kotlinforforge"
type="required"
versionRange="[6,)"
ordering="NONE"
side="BOTH"
